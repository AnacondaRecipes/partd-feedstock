{% set name = "partd" %}
{% set version = "1.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/partd-{{ version }}.tar.gz
  sha256: ce91abcdc6178d668bcaa431791a5a917d902341cb193f543fe445d494660485

build:
  noarch: python
  number: 1
  script: {{ PYTHON }} -m pip install --no-deps --ignore-installed . -vv

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python >=3.5
    - locket
    - toolz

test:
  imports:
    - partd
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/dask/partd
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: Appendable key-value storage
  description: |
    Partd stores key-value pairs. Values are raw bytes. It excels at shuffling
    operations.
  doc_url: https://pypi.python.org/pypi/partd/
  doc_source_url: https://github.com/dask/partd/blob/master/README.rst
  dev_url: https://github.com/dask/partd

extra:
  recipe-maintainers:
    - jcrist
    - mrocklin
    - koverholt
    - TomAugspurger
